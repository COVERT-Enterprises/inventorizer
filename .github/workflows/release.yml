name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, e.g. 26.7.4 (the script's version line is updated for you)"
        required: true
        type: string
      platform:
        description: "Platform, shown in the release title and download name"
        required: true
        type: choice
        options:
          - Windows
          - Linux
          - macOS
        default: Windows
      title:
        description: "Custom release title (leave empty for: Inventorizer v<version> (<platform>))"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Pre-release / beta"
        required: true
        type: boolean
        default: false
      offer_update:
        description: "Offer it to existing users through the in-app updater (stable releases only)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PRODUCT: Inventorizer
  SCRIPT: Inventorizer.ps1

jobs:
  check:
    name: Check the script on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Parse the script
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $env:SCRIPT), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Host "::error file=$($env:SCRIPT),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            exit 1
          }
          Write-Host "$($env:SCRIPT) parses cleanly on Windows PowerShell $($PSVersionTable.PSVersion)."

  release:
    name: Publish the release
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ inputs.platform }}
      TITLE: ${{ inputs.title }}
      PRERELEASE: ${{ inputs.prerelease }}
      OFFER_UPDATE: ${{ inputs.offer_update }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the inputs and prepare the release
        id: prep
        run: python3 .github/scripts/release.py prepare

      - name: Commit the new version number
        if: steps.prep.outputs.bumped == 'true'
        env:
          NEW_VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SCRIPT"
          git commit -m "Set version to $NEW_VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Build the download package
        id: build
        env:
          PACKAGE: ${{ steps.prep.outputs.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist/$PACKAGE"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='.gitattributes' --exclude='version.json' ./ "$RUNNER_TEMP/dist/$PACKAGE/"
          ( cd "$RUNNER_TEMP/dist" && zip -qr "$PACKAGE.zip" "$PACKAGE" )
          echo "zip=$RUNNER_TEMP/dist/$PACKAGE.zip" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prep.outputs.title }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          args=(--target "$(git rev-parse HEAD)" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "$ZIP" "${args[@]}"

      - name: Publish the update manifest (version.json)
        if: steps.prep.outputs.update_manifest == 'true'
        env:
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py manifest
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update version.json for $TAG"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
